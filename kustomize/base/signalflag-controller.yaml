# Source: signalflag-controller/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signalflag-controller
  namespace: respawn-system
  labels:
    app.kubernetes.io/name: signalflag-controller
    app.kubernetes.io/instance: signalflag-controller
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: signalflag-controller-0.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: signalflag-controller
      app.kubernetes.io/instance: signalflag-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signalflag-controller
        app.kubernetes.io/instance: signalflag-controller
    spec:
      serviceAccountName: signalflag-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: "public.ecr.aws/resim/signalflag-controller:0.0.0"
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --controller-concurrency=10
          env:
            # The controller runs PoolHandlers and reads their credentials in its own namespace.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

