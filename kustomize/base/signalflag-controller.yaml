# Source: signalflag-controller/templates/protect-crds.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: respawn-protect-crds
  labels:
    app.kubernetes.io/name: signalflag-controller
    app.kubernetes.io/instance: signalflag-controller
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: signalflag-controller-0.1.0
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apiextensions.k8s.io]
        apiVersions: ["*"]
        operations: [DELETE]
        resources: [customresourcedefinitions]
  validations:
    # A delete with no name removes every CRD, these included.
    - expression: "!(request.name.endsWith('.respawn.resim.io') || request.name == '')"
      reason: Forbidden
      messageExpression: >-
        request.name == ''
          ? 'Deleting every CustomResourceDefinition at once is blocked on this cluster, because it would delete the respawn.resim.io CRDs, every pool, and every pool namespace.'
          : 'Deleting CRD ' + request.name + ' is blocked: it would delete every object of that kind, and every pool namespace. To do it on purpose, delete the respawn-protect-crds ValidatingAdmissionPolicyBinding first.'

