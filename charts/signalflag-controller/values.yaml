# The ReSim environments this cluster runs berths for. Most clusters need only prod. The chart ships one
# resim-worker-<environment> ClusterRole for each, and lets the controller bind those roles and no others.
# A Berth whose spec.environment isn't listed here waits until it is.
environments:
  - prod

controller:
  image:
    repository: public.ecr.aws/resim/signalflag-controller
    # Defaults to the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  # Leader election keeps one replica active, so a second replica only shortens failover.
  replicas: 1
  # The maximum number of objects each controller reconciles at once.
  concurrency: 10
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# A Harbormaster polls ReSim for its berths' work and launches the workers. The chart can create one, which serves
# every Berth whose spec.harbormaster is its name.
#
# Kubernetes can't create a Harbormaster until its CRD exists, so on a first install leave this off and turn it
# on with helm upgrade, or create the Harbormaster yourself.
harbormaster:
  enabled: false
  name: default
  # The Harbormaster service's image. Required when enabled.
  image: ""
  # The ReSim worker API URL. Required when enabled.
  workerAPIURL: ""
  # The Secret, in the release namespace, that holds the Harbormaster's ReSim API credentials.
  credentialsSecretName: resim-api-credentials
  replicas: 1
  resources: {}

# A ValidatingAdmissionPolicy that refuses to delete the respawn.resim.io CRDs. Deleting a CRD deletes every
# object of that kind, so deleting the Berth CRD would delete every berth and its namespace.
protectCRDs:
  enabled: true
  # Also refuse a request that deletes every CRD in the cluster at once, a deletecollection, which would
  # include these. kubectl delete crd --all sends one delete per CRD, so it isn't affected: it deletes the
  # others and these are refused.
  blockBulkDelete: true
