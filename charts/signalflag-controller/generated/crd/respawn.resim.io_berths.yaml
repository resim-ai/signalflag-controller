---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: berths.respawn.resim.io
spec:
  group: respawn.resim.io
  names:
    kind: Berth
    listKind: BerthList
    plural: berths
    singular: berth
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.orgID
      name: Org
      type: string
    - jsonPath: .spec.environment
      name: Environment
      type: string
    - jsonPath: .spec.poolLabel
      name: Pool Label
      type: string
    - jsonPath: .spec.harbormaster
      name: Harbormaster
      type: string
    - jsonPath: .status.conditions[?(@.type=="BerthReady")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v2alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Berth is a place in a customer's cluster where ReSim work runs. respawn gives
          it a namespace named after the Berth, NetworkPolicies, and ServiceAccounts and
          RBAC for the worker and customer containers. Everything it creates is owned
          by the Berth and deleted with it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BerthSpec defines the desired state of a Berth.
            properties:
              debug:
                description: |-
                  Debug gives a Kubernetes group access to the berth's namespace for
                  debugging.
                properties:
                  group:
                    description: |-
                      Group is bound to the resim-berth-debug ClusterRole in the berth's
                      namespace. In ReSim's clusters an EKS access entry maps the org's debug
                      IAM role to it.
                    maxLength: 256
                    minLength: 1
                    type: string
                required:
                - group
                type: object
              environment:
                description: |-
                  Environment is the ReSim environment the berth serves, such as prod. It
                  selects the resim-worker-<environment> ClusterRole that the install
                  bundle ships.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              frog:
                description: |-
                  Frog runs ReSim's frog, which caches experience data in the berth's
                  namespace.
                properties:
                  enabled:
                    description: |-
                      Enabled creates the frog ServiceAccount, annotated with the customer
                      role, and binds the resim-berth-frog ClusterRole to it.
                    type: boolean
                type: object
              harbormaster:
                default: default
                description: |-
                  Harbormaster names the Harbormaster that serves this Berth. respawn puts it in
                  the resim.io/harbormaster label on the Berth and its namespace.
                maxLength: 63
                pattern: ^([A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?)?$
                type: string
              identity:
                description: Identity names the IAM roles the berth's pods run as.
                properties:
                  customerRoleARN:
                    description: CustomerRoleARN is the IAM role for customer containers.
                    pattern: ^arn:aws(-cn|-us-gov)?:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$
                    type: string
                  workerRoleARN:
                    description: |-
                      WorkerRoleARN is the IAM role for the ReSim worker container. ReSim
                      grants it write access to the org's experiences bucket.
                    pattern: ^arn:aws(-cn|-us-gov)?:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$
                    type: string
                required:
                - customerRoleARN
                - workerRoleARN
                type: object
              orgID:
                description: OrgID is the ReSim org the berth runs work for.
                minLength: 1
                type: string
              poolLabel:
                description: |-
                  PoolLabel is the pool label ReSim routes this berth's work to. The
                  Harbormaster polls the worker API for work with this label.
                minLength: 1
                type: string
              securityGroupPolicy:
                description: |-
                  SecurityGroupPolicy gives the berth's pods the environment's EC2 security
                  group, through the VPC CNI's SecurityGroupPolicy.
                properties:
                  enabled:
                    description: |-
                      Enabled creates a SecurityGroupPolicy in the berth's namespace for the
                      environment's security group.
                    type: boolean
                type: object
              serviceAccountNames:
                description: |-
                  ServiceAccountNames overrides the names of the worker and customer
                  ServiceAccounts, which default to worker and customer.
                properties:
                  customer:
                    description: Customer is the customer ServiceAccount's name.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                    x-kubernetes-validations:
                    - message: frog is the frog ServiceAccount's name
                      rule: self != 'frog'
                  worker:
                    description: Worker is the worker ServiceAccount's name.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                    x-kubernetes-validations:
                    - message: frog is the frog ServiceAccount's name
                      rule: self != 'frog'
                type: object
              skipNetworkPolicy:
                description: |-
                  SkipNetworkPolicy leaves the berth's namespace without NetworkPolicies,
                  for clusters whose network plugin doesn't enforce them.
                type: boolean
            required:
            - environment
            - identity
            - orgID
            - poolLabel
            type: object
            x-kubernetes-validations:
            - message: the worker and customer ServiceAccounts need different names
              rule: '!has(self.serviceAccountNames) || (has(self.serviceAccountNames.worker)
                ? self.serviceAccountNames.worker : ''worker'') != (has(self.serviceAccountNames.customer)
                ? self.serviceAccountNames.customer : ''customer'')'
          status:
            description: BerthStatus defines the observed state of a Berth.
            properties:
              conditions:
                description: Conditions store the status conditions of the Berth.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              resources:
                additionalProperties:
                  type: string
                default: {}
                description: |-
                  Resources names the objects respawn created for the berth, such as its
                  Namespace and ServiceAccounts. The Harbormaster reads them from here.
                type: object
            required:
            - resources
            type: object
        required:
        - metadata
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name becomes the berth's namespace name, so it must be
            a DNS-1123 label
          rule: self.metadata.name.size() <= 63 && self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
        - message: metadata.name must not be default or start with kube-
          rule: self.metadata.name != 'default' && !self.metadata.name.startsWith('kube-')
    served: true
    storage: true
    subresources:
      status: {}
