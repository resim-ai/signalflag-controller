---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: pools.respawn.resim.io
spec:
  group: respawn.resim.io
  names:
    kind: Pool
    listKind: PoolList
    plural: pools
    singular: pool
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.orgID
      name: Org
      type: string
    - jsonPath: .spec.environment
      name: Environment
      type: string
    - jsonPath: .spec.poolLabel
      name: Pool Label
      type: string
    - jsonPath: .spec.handler
      name: Handler
      type: string
    - jsonPath: .status.conditions[?(@.type=="PoolReady")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v2alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Pool is a place in a customer's cluster where ReSim work runs. respawn gives
          it a namespace named after the Pool, NetworkPolicies, and ServiceAccounts and
          RBAC for the worker and customer containers. Everything it creates is owned
          by the Pool and deleted with it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PoolSpec defines the desired state of a Pool.
            properties:
              environment:
                description: |-
                  Environment is the ReSim environment the pool serves, such as prod. It
                  selects the resim-worker-<environment> ClusterRole that the install
                  bundle ships.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              handler:
                default: default
                description: |-
                  Handler names the PoolHandler that serves this pool. respawn puts it in
                  the resim.io/handler label on the Pool and its namespace.
                maxLength: 63
                pattern: ^([A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?)?$
                type: string
              identity:
                description: Identity names the IAM roles the pool's pods run as.
                properties:
                  customerRoleARN:
                    description: CustomerRoleARN is the IAM role for customer containers.
                    pattern: ^arn:aws(-cn|-us-gov)?:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$
                    type: string
                  workerRoleARN:
                    description: |-
                      WorkerRoleARN is the IAM role for the ReSim worker container. ReSim
                      grants it write access to the org's experiences bucket.
                    pattern: ^arn:aws(-cn|-us-gov)?:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$
                    type: string
                required:
                - customerRoleARN
                - workerRoleARN
                type: object
              orgID:
                description: OrgID is the ReSim org the pool runs work for.
                minLength: 1
                type: string
              poolLabel:
                description: |-
                  PoolLabel is the pool label ReSim routes this pool's work to. The
                  PoolHandler polls the worker API for work with this label.
                minLength: 1
                type: string
              skipNetworkPolicy:
                description: |-
                  SkipNetworkPolicy leaves the pool's namespace without NetworkPolicies,
                  for clusters whose network plugin doesn't enforce them.
                type: boolean
            required:
            - environment
            - identity
            - orgID
            - poolLabel
            type: object
          status:
            description: PoolStatus defines the observed state of a Pool.
            properties:
              conditions:
                description: Conditions store the status conditions of the Pool.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              resources:
                additionalProperties:
                  type: string
                default: {}
                description: |-
                  Resources names the objects respawn created for the pool, such as its
                  Namespace and ServiceAccounts. The PoolHandler reads them from here.
                type: object
            required:
            - resources
            type: object
        required:
        - metadata
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name becomes the pool's namespace name, so it must be
            a DNS-1123 label
          rule: self.metadata.name.size() <= 63 && self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
        - message: metadata.name must not be default or start with kube-
          rule: self.metadata.name != 'default' && !self.metadata.name.startsWith('kube-')
    served: true
    storage: true
    subresources:
      status: {}
