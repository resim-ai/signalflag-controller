{{- if .Values.protectCRDs.enabled }}
{{- /*
Refuses to delete the respawn.resim.io CRDs. RBAC can't stop a cluster admin, so the API server enforces it. To
remove the CRDs on purpose, delete the binding first.
*/}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: respawn-protect-crds
  labels:
    {{- include "signalflag-controller.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apiextensions.k8s.io]
        apiVersions: ["*"]
        operations: [DELETE]
        resources: [customresourcedefinitions]
  validations:
    {{- if .Values.protectCRDs.blockBulkDelete }}
    # A delete with no name removes every CRD, these included.
    - expression: "!(request.name.endsWith('.respawn.resim.io') || request.name == '')"
    {{- else }}
    - expression: "!request.name.endsWith('.respawn.resim.io')"
    {{- end }}
      reason: Forbidden
      messageExpression: >-
        request.name == ''
          ? 'Deleting every CustomResourceDefinition at once is blocked on this cluster, because it would delete the respawn.resim.io CRDs, every pool, and every pool namespace.'
          : 'Deleting CRD ' + request.name + ' is blocked: it would delete every object of that kind, and every pool namespace. To do it on purpose, delete the respawn-protect-crds ValidatingAdmissionPolicyBinding first.'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: respawn-protect-crds
  labels:
    {{- include "signalflag-controller.labels" . | nindent 4 }}
spec:
  policyName: respawn-protect-crds
  validationActions: [Deny]
{{- end }}
